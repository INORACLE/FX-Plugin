<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>盘口</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e1621;
      color: #dce6f2;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      width: 900px;
      padding: 26px 28px 24px;
      background: #0e1621;
    }

    .head {
      padding: 20px 24px;
      border: 1px solid #22374f;
      border-radius: 16px;
      background: linear-gradient(135deg, #16283d 0%, #10202f 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #4fbf9a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.4px;
    }

    .title {
      margin: 0;
      color: #f2f7fc;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }

    .sub {
      margin: 6px 0 0;
      color: #8ba3bd;
      font-size: 13.5px;
    }

    table {
      width: 100%;
      margin-top: 14px;
      border: 1px solid #1e3149;
      border-radius: 14px;
      border-spacing: 0;
      border-collapse: separate;
      overflow: hidden;
      background: #131f2e;
    }

    thead th {
      padding: 11px 16px;
      border-bottom: 1px solid #1e3149;
      background: #16243a;
      color: #7fa5c9;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .6px;
      text-align: right;
    }

    thead th:first-child {
      text-align: left;
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid #182739;
      font-size: 15px;
      text-align: right;
    }

    tbody td:first-child {
      text-align: left;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr.cur {
      background: rgba(79, 191, 154, .1);
    }

    .no {
      color: #4a6280;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .pair {
      color: #e6eef7;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 15.5px;
      font-weight: 700;
    }

    .cn {
      margin-left: 8px;
      color: #7f97af;
      font-size: 13.5px;
    }

    .rate {
      color: #e6eef7;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 15.5px;
      font-weight: 600;
    }

    .chg {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 14.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .up {
      color: #4fbf9a;
    }

    .down {
      color: #e8697d;
    }

    .spark {
      width: 84px;
      height: 26px;
      vertical-align: middle;
    }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #4fbf9a;
      color: #0e1621;
      font-size: 11px;
      font-weight: 700;
    }

    .foot {
      margin-top: 12px;
      color: #55697d;
      font-size: 12.5px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="container">
    <header class="head">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 class="title">{{title}}</h1>
      <p class="sub">{{sub}}</p>
    </header>

    <table>
      <thead>
        <tr>
          <th>货币对</th>
          <th>现价</th>
          <th>涨跌</th>
          <th>走势</th>
        </tr>
      </thead>
      <tbody>
        {{each rows r}}
        <tr class="{{r.cls}}">
          <td>
            <span class="no">{{r.no}}</span>
            <span class="pair">{{r.id}}</span>
            <span class="cn">{{r.name}}</span>
            {{if r.current}}<span class="tag">当前</span>{{/if}}
          </td>
          <td class="rate">{{r.rate}}</td>
          <td class="chg {{r.cls}}">{{r.change}}</td>
          <td>
            <svg class="spark" viewBox="0 0 84 26" preserveAspectRatio="none">
              <polyline points="{{r.spark}}" fill="none" stroke="{{r.stroke}}" stroke-width="1.7"
                stroke-linejoin="round" stroke-linecap="round" />
            </svg>
          </td>
        </tr>
        {{/each}}
      </tbody>
    </table>

    <div class="foot">{{foot}}</div>
  </div>
</body>

</html>
