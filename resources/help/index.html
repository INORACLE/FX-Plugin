<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FX 简单! · 指令表</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e1621;
      color: #dce6f2;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      width: 900px;
      padding: 26px 28px 24px;
      background: #0e1621;
    }

    /* ---------- 头部 ---------- */
    .head {
      position: relative;
      overflow: hidden;
      padding: 24px 26px 20px;
      border: 1px solid #22374f;
      border-radius: 16px;
      background: linear-gradient(135deg, #16283d 0%, #10202f 60%, #142b3a 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .head::after {
      position: absolute;
      right: -60px;
      bottom: -70px;
      width: 220px;
      height: 220px;
      border: 26px solid rgba(61, 190, 148, .09);
      border-radius: 50%;
      content: "";
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #4fbf9a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.6px;
    }

    .title {
      position: relative;
      margin: 0;
      color: #f2f7fc;
      font-size: 31px;
      line-height: 1.2;
      font-weight: 700;
    }

    .sub {
      position: relative;
      margin: 10px 0 0;
      color: #8ba3bd;
      font-size: 14px;
      line-height: 1.6;
    }

    .alias {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .alias span {
      padding: 4px 10px;
      border: 1px solid #2c4964;
      border-radius: 999px;
      background: rgba(79, 191, 154, .08);
      color: #9fd8c4;
      font-size: 13px;
      font-weight: 600;
    }

    /* ---------- 指令区 ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .sec {
      padding: 14px 16px 12px;
      border: 1px solid #1e3149;
      border-radius: 13px;
      background: #131f2e;
    }

    .sec h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      color: #7fd8bd;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 700;
    }

    .sec h2::before {
      width: 4px;
      height: 17px;
      border-radius: 4px;
      background: #4fbf9a;
      content: "";
    }

    .sec h2 em {
      margin-left: auto;
      color: #5c7893;
      font-size: 12px;
      font-style: normal;
      font-weight: 500;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 6px 0;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .cmd {
      flex: none;
      color: #ffd98a;
      font-family: Consolas, "SFMono-Regular", "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .arg {
      flex: none;
      color: #6d8aa5;
      font-family: Consolas, "SFMono-Regular", "Courier New", monospace;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .desc {
      color: #9db1c6;
      word-break: break-word;
    }

    .cmd + .desc::before {
      content: "· ";
      color: #3c5872;
    }

    /* ---------- 规则区 ---------- */
    .rules {
      margin-top: 14px;
      padding: 15px 18px 14px;
      border: 1px solid #2a3a2f;
      border-radius: 13px;
      background: #132019;
    }

    .rules h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: #8fd6a8;
      font-size: 16px;
      font-weight: 700;
    }

    .rules h2::before {
      width: 4px;
      height: 16px;
      border-radius: 4px;
      background: #63c98d;
      content: "";
    }

    .rl {
      display: flex;
      margin: 5px 0;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .rl b {
      flex: none;
      width: 92px;
      color: #7fb894;
      font-weight: 600;
    }

    .rl span {
      color: #9dbcaa;
    }

    .rl span i {
      color: #ffd98a;
      font-style: normal;
      font-weight: 700;
    }

    .foot {
      margin-top: 13px;
      color: #55697d;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="container">
    <header class="head">
      <p class="eyebrow">{{pluginName}}</p>
      <h1 class="title">{{title}}</h1>
      <p class="sub">{{subtitle}}</p>
      <div class="alias">
        {{each aliases a}}<span>{{a}}</span>{{/each}}
      </div>
    </header>

    <main class="grid">
      {{each sections s}}
      <section class="sec">
        <h2>{{s.title}}</h2>
        {{each s.items it}}
        <div class="row">
          <span class="cmd">{{it.cmd}}</span>{{if it.arg}}<span class="arg">{{it.arg}}</span>{{/if}}
          <span class="desc">{{it.desc}}</span>
        </div>
        {{/each}}
      </section>
      {{/each}}
    </main>

    <section class="rules">
      <h2>游戏规则与参数</h2>
      {{each rules r}}
      <div class="rl"><b>{{r.k}}</b><span>{{@r.v}}</span></div>
      {{/each}}
    </section>

    <div class="foot">{{footer}}</div>
  </div>
</body>

</html>
