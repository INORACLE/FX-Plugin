<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经典战役</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e1621;
      color: #dce6f2;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      width: 900px;
      padding: 26px 28px 24px;
      background: #0e1621;
    }

    .head {
      padding: 20px 24px;
      border: 1px solid #3a3048;
      border-radius: 16px;
      background: linear-gradient(135deg, #2a2038 0%, #1a1428 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #c9a3f5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.4px;
    }

    .title {
      margin: 0;
      color: #f4f0fa;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }

    .sub {
      margin: 6px 0 0;
      color: #9d8fb8;
      font-size: 13.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      padding: 15px 17px 14px;
      border: 1px solid #2b2340;
      border-radius: 14px;
      background: #1c1628;
    }

    .card .top {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }

    .card .no {
      flex: none;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      background: #33284a;
      color: #c9a3f5;
      font-family: Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      line-height: 25px;
      text-align: center;
    }

    .card h2 {
      flex: 1;
      min-width: 0;
      margin: 0;
      color: #eee6f8;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    .card .pair {
      flex: none;
      padding: 3px 9px;
      border: 1px solid #4a3a68;
      border-radius: 999px;
      color: #c4a9ea;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .card .desc {
      min-height: 40px;
      margin: 0 0 10px;
      color: #9b8fb0;
      font-size: 13px;
      line-height: 1.6;
    }

    .card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card .meta span {
      padding: 3px 9px;
      border: 1px solid #332b45;
      border-radius: 7px;
      background: #221a30;
      color: #8f83a5;
      font-size: 11.5px;
    }

    .card .meta b {
      color: #c4a9ea;
      font-weight: 600;
    }

    .foot {
      margin-top: 13px;
      color: #6a5f7d;
      font-size: 12.5px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="container">
    <header class="head">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 class="title">{{title}}</h1>
      <p class="sub">{{sub}}</p>
    </header>

    <div class="grid">
      {{each battles b}}
      <section class="card">
        <div class="top">
          <div class="no">{{b.no}}</div>
          <h2>{{b.title}}</h2>
          <div class="pair">{{b.pair}}</div>
        </div>
        <p class="desc">{{b.desc}}</p>
        <div class="meta">
          <span>事件日 <b>{{b.event}}</b></span>
          <span>回放 <b>{{b.start}} ~ {{b.end}}</b></span>
        </div>
      </section>
      {{/each}}
    </div>

    <div class="foot">{{foot}}</div>
  </div>
</body>

</html>
